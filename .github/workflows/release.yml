name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (stable: v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease/nightly"
        required: true
        default: false
        type: boolean
      publish_android:
        description: "Build and publish Android APK (required when Android release inputs changed)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish_android: ${{ steps.release.outputs.publish_android }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          PUBLISH_ANDROID: ${{ inputs.publish_android }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Release workflow must be dispatched from $DEFAULT_BRANCH" >&2
            exit 1
          }
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "Release source must be a commit on $DEFAULT_BRANCH" >&2
            exit 1
          }

          # Both channels feed a client updater, so every tag satisfies the shared
          # release grammar. Android's tighter versionCode bounds are checked only
          # when an APK is actually requested (ADR-0223).
          version="${RELEASE_TAG#v}"
          node scripts/release/release-version.mjs --validate "$RELEASE_TAG"
          case "$version" in
            *-beta.*)
              [[ "$PRERELEASE" == "true" ]] || {
                echo "A -beta.N tag must be dispatched as a prerelease: $RELEASE_TAG" >&2
                exit 1
              }
              ;;
            *)
              [[ "$PRERELEASE" == "false" ]] || {
                echo "A prerelease must use a vX.Y.Z-beta.N tag: $RELEASE_TAG" >&2
                exit 1
              }
              ;;
          esac

          # tauri.conf.json owns the version the updater compares against;
          # Cargo.toml owns the version every status surface reports. A release
          # where they disagree ships an app whose displayed version is not the
          # one it compares with.
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          [[ "$version" == "$app_version" ]] || {
            echo "Release tag $version does not match app version $app_version" >&2
            exit 1
          }
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          [[ "$version" == "$crate_version" ]] || {
            echo "Release tag $version does not match src-tauri/Cargo.toml version $crate_version" >&2
            exit 1
          }

          if [[ "$PUBLISH_ANDROID" == "true" ]]; then
            # Reject a version the Android versionCode encoding cannot carry
            # before any artifact is built.
            node scripts/release/android-version-code.mjs "$RELEASE_TAG"
          fi

          # Channel forwardness is checked *before* anything is published. If the
          # only check lived in the channel job, a version lower than the current
          # channel would already be latest by the time it was refused: the legacy
          # endpoint would serve it, and Android would take it as an upgrade
          # because the new versionCode scheme is numerically larger than the
          # legacy one (ADR-0190).
          # `gh api` prints the error body to stdout on a 404 and does not apply
          # --jq to it, so a missing file yields JSON rather than nothing. Branch
          # on the exit status and only read stdout when the call succeeded.
          channel_version() {
            local body
            body="$(gh api "repos/$GITHUB_REPOSITORY/contents/desktop-$1.json?ref=release-channels" --jq '.content' 2>/dev/null)" || return 0
            printf '%s' "$body" | base64 -d | jq -r '.version'
          }
          if [[ "$PRERELEASE" == "true" ]]; then
            current_channel_version="$(channel_version beta)"
          else
            current_channel_version="$(channel_version stable)"
          fi
          if [[ -n "$current_channel_version" && "$current_channel_version" != "null" ]]; then
            node scripts/release/release-version.mjs \
              --newer "$version" --than "$current_channel_version" || {
              echo "Release $version does not move its channel forward from $current_channel_version" >&2
              exit 1
            }
          fi

          # Skipping Android is safe only while the release APK inputs are
          # unchanged from the Android channel's current artifact. Test/debug-only
          # sources are intentionally outside this release-input allowlist.
          if [[ "$PUBLISH_ANDROID" == "false" ]]; then
            android_channel="stable"
            [[ "$PRERELEASE" == "true" ]] && android_channel="beta"
            android_body="$(gh api "repos/$GITHUB_REPOSITORY/contents/android-$android_channel.json?ref=release-channels" --jq '.content')"
            android_manifest="$(printf '%s' "$android_body" | base64 -d)"
            android_release_tag="$(jq -er '.releaseUrl | split("/")[-1]' <<<"$android_manifest")"
            git rev-parse --verify "refs/tags/$android_release_tag^{commit}" >/dev/null || {
              echo "Android channel tag is unavailable locally: $android_release_tag" >&2
              exit 1
            }
            android_release_inputs=(
              apps/android/app/src/main
              apps/android/app/build.gradle.kts
              apps/android/app/proguard-rules.pro
              apps/android/build.gradle.kts
              apps/android/settings.gradle.kts
              apps/android/gradle.properties
              apps/android/gradle/wrapper/gradle-wrapper.properties
            )
            if ! git diff --quiet "$android_release_tag"..."$GITHUB_SHA" -- "${android_release_inputs[@]}"; then
              echo "Android release inputs changed since $android_release_tag; dispatch again with publish_android=true" >&2
              git diff --name-only "$android_release_tag"..."$GITHUB_SHA" -- "${android_release_inputs[@]}" >&2
              exit 1
            fi
          fi

          existing_release_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)] | first | .id // empty'
          )"
          if [[ -n "$existing_release_id" ]]; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists; the release workflow must create it: $RELEASE_TAG" >&2
            exit 1
          fi

          release_json="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$RELEASE_TAG" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            -F generate_release_notes=true)"
          release_id="$(jq -er '.id' <<<"$release_json")"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >>"$GITHUB_OUTPUT"
          echo "publish_android=$PUBLISH_ANDROID" >>"$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # tauri-action merges each platform into the release's latest.json.
      # Serialize uploads so two fresh platform manifests cannot clobber one another.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # RPM `Version` cannot contain `-` and deb version ordering does not
            # match semver prerelease ordering, so a beta build is limited to the
            # bundles whose version rules accept `x.y.z-beta.N` (ADR-0190).
            prerelease_bundles: nsis,updater
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            prerelease_bundles: appimage,updater

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        # action-v0.6.2; pin the exact reviewed code because this step receives
        # the updater signing key.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: >-
            --target ${{ matrix.target }}
            ${{ needs.prepare.outputs.prerelease == 'true' && format('--bundles {0}', matrix.prerelease_bundles) || '' }}

  android:
    needs: prepare
    if: needs.prepare.outputs.publish_android == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_APP_SIGNING_CERT_SHA256: ${{ vars.ANDROID_APP_SIGNING_CERT_SHA256 }}
      ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ vars.ANDROID_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_APP_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ANDROID_APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          for name in \
            ANDROID_APP_SIGNING_KEYSTORE_BASE64 \
            ANDROID_APP_SIGNING_KEYSTORE_PASSWORD \
            ANDROID_APP_SIGNING_KEY_ALIAS \
            ANDROID_APP_SIGNING_KEY_PASSWORD \
            ANDROID_APP_SIGNING_CERT_SHA256 \
            ANDROID_GOOGLE_WEB_CLIENT_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release input: $name" >&2; exit 1; }
          done

          # versionName/versionCode come from the shared encoder so the bounds
          # and the beta slot layout have one owner and unit tests (ADR-0190).
          encoded="$(node scripts/release/android-version-code.mjs "$RELEASE_TAG")"
          version="$(printf '%s\n' "$encoded" | sed -n 's/^versionName=//p')"
          version_code="$(printf '%s\n' "$encoded" | sed -n 's/^versionCode=//p')"
          [[ -n "$version" && -n "$version_code" ]] || {
            echo "Android version encoding produced no output for $RELEASE_TAG" >&2
            exit 1
          }

          keystore="$RUNNER_TEMP/laymux-android-app-signing.jks"
          printf '%s' "$ANDROID_APP_SIGNING_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          chmod 600 "$keystore"
          [[ -s "$keystore" ]] || { echo "Decoded keystore is empty" >&2; exit 1; }

          {
            echo "LAYMUX_ANDROID_VERSION_NAME=$version"
            echo "LAYMUX_ANDROID_VERSION_CODE=$version_code"
            echo "LAYMUX_ANDROID_APP_SIGNING_STORE_FILE=$keystore"
            echo "LAYMUX_ANDROID_APP_SIGNING_STORE_PASSWORD=$ANDROID_APP_SIGNING_KEYSTORE_PASSWORD"
            echo "LAYMUX_ANDROID_APP_SIGNING_KEY_ALIAS=$ANDROID_APP_SIGNING_KEY_ALIAS"
            echo "LAYMUX_ANDROID_APP_SIGNING_KEY_PASSWORD=$ANDROID_APP_SIGNING_KEY_PASSWORD"
            echo "LAYMUX_CLOUD_BASE_URL=https://app.laymux.com"
            echo "LAYMUX_GOOGLE_WEB_CLIENT_ID=$ANDROID_GOOGLE_WEB_CLIENT_ID"
          } >>"$GITHUB_ENV"

      - name: Test and build signed Android APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and stage Android APK
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$apk" ]] || { echo "Signed release APK was not produced" >&2; exit 1; }

          verify_output="$($build_tools/apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output"
          actual_fingerprint="$({ printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1; } | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$ANDROID_APP_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$actual_fingerprint" && "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo "Android signer certificate fingerprint mismatch" >&2
            exit 1
          }

          output_dir="$RUNNER_TEMP/laymux-android-release"
          output_apk="$output_dir/Laymux-Android-${LAYMUX_ANDROID_VERSION_NAME}.apk"
          mkdir -p "$output_dir"
          cp "$apk" "$output_apk"
          (cd "$output_dir" && sha256sum "$(basename "$output_apk")" >"$(basename "$output_apk").sha256")
          echo "ANDROID_RELEASE_APK=$output_apk" >>"$GITHUB_ENV"
          echo "ANDROID_RELEASE_CHECKSUM=$output_apk.sha256" >>"$GITHUB_ENV"

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$ANDROID_RELEASE_APK" "$ANDROID_RELEASE_CHECKSUM" --clobber

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "${LAYMUX_ANDROID_APP_SIGNING_STORE_FILE:-$RUNNER_TEMP/laymux-android-app-signing.jks}"

  channel_bootstrap:
    # The channel branch must already hold a valid manifest for both channels
    # *before* anything is published (ADR-0190). A channel-aware build that goes
    # latest first would send every upgraded install to a 404 for as long as the
    # downstream job took — or forever, if it failed.
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-channels
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Seed the channel branch if it is missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release-channels
        run: |
          set -euo pipefail

          # Branch on the exit status, never on the output: `gh api` prints the
          # error body to stdout on a 404 and does not apply --jq to it, so a
          # missing file reads as a non-empty value and would skip the seeding
          # this job exists to do.
          # The condition is "every stable file exists", not "the branch exists":
          # a branch seeded before the Android channel existed holds no Android
          # file, and a channel-aware app would then get a 404 from its fixed
          # endpoint until the next release (ADR-0223).
          if gh api "repos/$GITHUB_REPOSITORY/contents/desktop-stable.json?ref=$BRANCH" >/dev/null 2>&1 &&
            gh api "repos/$GITHUB_REPOSITORY/contents/android-stable.json?ref=$BRANCH" >/dev/null 2>&1; then
            echo "channel branch already seeded"
            exit 0
          fi

          # Desktop seeds from the latest stable release. Android may intentionally
          # lag, so recover it from the newest stable release that actually has the
          # correctly named APK asset (ADR-0223).
          seed_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null)" || seed_tag=""
          [[ -n "$seed_tag" && "$seed_tag" != "null" ]] || {
            echo "No stable release to seed the channel branch from" >&2
            exit 1
          }

          channels="$RUNNER_TEMP/channels"
          mkdir -p "$channels"
          # Carry over whatever the branch already holds. The publish step
          # rebuilds the whole tree, so a file left out here is deleted.
          for file in desktop-stable.json desktop-beta.json android-stable.json android-beta.json; do
            if body="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$BRANCH" --jq '.content' 2>/dev/null)"; then
              printf '%s' "$body" | base64 -d >"$channels/$file"
            fi
          done

          android_seed_json="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -sc '
                [.[][]
                  | select(.draft == false and .prerelease == false)
                  | . as $release
                  | ($release.tag_name | sub("^v"; "")) as $version
                  | select(any($release.assets[]?; .name == ("Laymux-Android-" + $version + ".apk")))]
                | sort_by(.published_at) | reverse | first
              '
          )"
          android_seed_tag="$(jq -er '.tag_name' <<<"$android_seed_json")" || {
            echo "No stable release with an Android APK is available for channel seeding" >&2
            exit 1
          }
          android_seed_published="$(jq -er '.published_at' <<<"$android_seed_json")"

          seed_manifest="$RUNNER_TEMP/seed-latest.json"
          gh release download "$seed_tag" --pattern latest.json --output "$seed_manifest" --clobber
          seed_published="$(gh release view "$seed_tag" --json publishedAt --jq '.publishedAt')"
          node scripts/release/channel-manifest.mjs \
            --tag "$seed_tag" --prerelease false --seed-stable true \
            --publish-android true --android-tag "$android_seed_tag" \
            --manifest "$seed_manifest" --channel-dir "$channels" \
            --pub-date "$seed_published" --android-pub-date "$android_seed_published" \
            --owner "${GITHUB_REPOSITORY%%/*}" --repo "${GITHUB_REPOSITORY##*/}"

          bash "$GITHUB_WORKSPACE/scripts/release/publish-channel-commit.sh" \
            "$channels" "$BRANCH" "seed channel manifests from $seed_tag"

  publish:
    # A requested Android artifact is a hard gate. An intentional omission is
    # allowed only after prepare proved the Android release inputs are unchanged.
    needs: [prepare, build, android, channel_bootstrap]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.build.result == 'success' &&
        needs.channel_bootstrap.result == 'success' &&
        (
          needs.android.result == 'success' ||
          (
            needs.android.result == 'skipped' &&
            needs.prepare.outputs.publish_android == 'false'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=false -f make_latest=true
          fi

  channels:
    # The channel manifest, not GitHub's `latest` pointer, is what the app reads
    # (ADR-0190). Runs only after the release is fully published so a channel can
    # never point at a draft or an incomplete artifact set.
    needs: [prepare, publish]
    # publish is if-gated to run when android is intentionally skipped
    # (desktop-only release, ADR-0223). Without a matching override here the
    # skipped android job propagates through publish's needs chain and skips
    # this job too, so a desktop-only release never advances the channel
    # manifests the updater reads (observed on v0.12.6).
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-channels
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Update channel manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PUBLISH_ANDROID: ${{ needs.prepare.outputs.publish_android }}
          BRANCH: release-channels
        run: |
          set -euo pipefail

          channels="$RUNNER_TEMP/channels"
          mkdir -p "$channels"

          # Read the branch through the API rather than cloning: the channel
          # branch holds only these four files, and a clone would put the source
          # tree and a credential into the deployment working copy. The branch is
          # guaranteed to exist by the bootstrap job that gates publish.
          # Every file must be downloaded, not only the ones this release writes:
          # the publish step rebuilds the whole tree, so a file missing from the
          # directory is deleted from the branch (ADR-0223).
          # Again: exit status, not output. A 404 body on stdout would be written
          # as if it were a manifest.
          for file in desktop-stable.json desktop-beta.json android-stable.json android-beta.json; do
            rm -f "$channels/$file"
            if body="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$BRANCH" --jq '.content' 2>/dev/null)"; then
              printf '%s' "$body" | base64 -d >"$channels/$file"
            fi
          done

          manifest="$RUNNER_TEMP/latest.json"
          gh release download "$RELEASE_TAG" --pattern latest.json --output "$manifest" --clobber

          # Validation, the forward-only invariants and the write plan live in the
          # script so they are unit tested rather than discovered in a release.
          # The Android manifest records when the release went out, so it comes
          # from the release itself rather than from the runner clock.
          published_at="$(gh release view "$RELEASE_TAG" --json publishedAt --jq '.publishedAt')"

          written="$(node "$GITHUB_WORKSPACE/scripts/release/channel-manifest.mjs" \
            --tag "$RELEASE_TAG" \
            --prerelease "$PRERELEASE" \
            --publish-android "$PUBLISH_ANDROID" \
            --manifest "$manifest" \
            --channel-dir "$channels" \
            --pub-date "$published_at" \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo "${GITHUB_REPOSITORY##*/}")"
          printf 'channel files to publish:\n%s\n' "${written:-<none>}"

          bash "$GITHUB_WORKSPACE/scripts/release/publish-channel-commit.sh" \
            "$channels" "$BRANCH" "release: $RELEASE_TAG channel manifests"
