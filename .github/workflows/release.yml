name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (stable: v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease/nightly"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Release workflow must be dispatched from $DEFAULT_BRANCH" >&2
            exit 1
          }
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "Release source must be a commit on $DEFAULT_BRANCH" >&2
            exit 1
          }

          # Both channels now feed a client updater, so both tags must satisfy the
          # client's tag<->version contract (ADR-0189). The tag *form* is checked
          # once, by the shared encoder below — duplicating the grammar here would
          # let the two copies drift. This only pairs the tag with the channel the
          # dispatcher asked for.
          version="${RELEASE_TAG#v}"
          case "$version" in
            *-beta.*)
              [[ "$PRERELEASE" == "true" ]] || {
                echo "A -beta.N tag must be dispatched as a prerelease: $RELEASE_TAG" >&2
                exit 1
              }
              ;;
            *)
              [[ "$PRERELEASE" == "false" ]] || {
                echo "A prerelease must use a vX.Y.Z-beta.N tag: $RELEASE_TAG" >&2
                exit 1
              }
              ;;
          esac

          # tauri.conf.json owns the version the updater compares against;
          # Cargo.toml owns the version every status surface reports. A release
          # where they disagree ships an app whose displayed version is not the
          # one it compares with.
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          [[ "$version" == "$app_version" ]] || {
            echo "Release tag $version does not match app version $app_version" >&2
            exit 1
          }
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          [[ "$version" == "$crate_version" ]] || {
            echo "Release tag $version does not match src-tauri/Cargo.toml version $crate_version" >&2
            exit 1
          }

          # Reject a version the Android versionCode encoding cannot carry
          # before any artifact is built.
          node scripts/release/android-version-code.mjs "$RELEASE_TAG"

          # Channel forwardness is checked *before* anything is published. If the
          # only check lived in the channel job, a version lower than the current
          # channel would already be latest by the time it was refused: the legacy
          # endpoint would serve it, and Android would take it as an upgrade
          # because the new versionCode scheme is numerically larger than the
          # legacy one (ADR-0189).
          channel_version() {
            gh api "repos/$GITHUB_REPOSITORY/contents/desktop-$1.json?ref=release-channels" \
              --jq '.content' 2>/dev/null | base64 -d | jq -r '.version' 2>/dev/null || true
          }
          if [[ "$PRERELEASE" == "true" ]]; then
            current_channel_version="$(channel_version beta)"
          else
            current_channel_version="$(channel_version stable)"
          fi
          if [[ -n "$current_channel_version" && "$current_channel_version" != "null" ]]; then
            node scripts/release/release-version.mjs \
              --newer "$version" --than "$current_channel_version" || {
              echo "Release $version does not move its channel forward from $current_channel_version" >&2
              exit 1
            }
          fi

          existing_release_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)] | first | .id // empty'
          )"
          if [[ -n "$existing_release_id" ]]; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists; the release workflow must create it: $RELEASE_TAG" >&2
            exit 1
          fi

          release_json="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$RELEASE_TAG" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            -F generate_release_notes=true)"
          release_id="$(jq -er '.id' <<<"$release_json")"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >>"$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # tauri-action merges each platform into the release's latest.json.
      # Serialize uploads so two fresh platform manifests cannot clobber one another.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # RPM `Version` cannot contain `-` and deb version ordering does not
            # match semver prerelease ordering, so a beta build is limited to the
            # bundles whose version rules accept `x.y.z-beta.N` (ADR-0189).
            prerelease_bundles: nsis,updater
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            prerelease_bundles: appimage,updater

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        # action-v0.6.2; pin the exact reviewed code because this step receives
        # the updater signing key.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: >-
            --target ${{ matrix.target }}
            ${{ needs.prepare.outputs.prerelease == 'true' && format('--bundles {0}', matrix.prerelease_bundles) || '' }}

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      ANDROID_APP_SIGNING_CERT_SHA256: ${{ vars.ANDROID_APP_SIGNING_CERT_SHA256 }}
      ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ vars.ANDROID_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_APP_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ANDROID_APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          for name in \
            ANDROID_APP_SIGNING_KEYSTORE_BASE64 \
            ANDROID_APP_SIGNING_KEYSTORE_PASSWORD \
            ANDROID_APP_SIGNING_KEY_ALIAS \
            ANDROID_APP_SIGNING_KEY_PASSWORD \
            ANDROID_APP_SIGNING_CERT_SHA256 \
            ANDROID_GOOGLE_WEB_CLIENT_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release input: $name" >&2; exit 1; }
          done

          # versionName/versionCode come from the shared encoder so the bounds
          # and the beta slot layout have one owner and unit tests (ADR-0189).
          encoded="$(node scripts/release/android-version-code.mjs "$RELEASE_TAG")"
          version="$(printf '%s\n' "$encoded" | sed -n 's/^versionName=//p')"
          version_code="$(printf '%s\n' "$encoded" | sed -n 's/^versionCode=//p')"
          [[ -n "$version" && -n "$version_code" ]] || {
            echo "Android version encoding produced no output for $RELEASE_TAG" >&2
            exit 1
          }

          keystore="$RUNNER_TEMP/laymux-android-app-signing.jks"
          printf '%s' "$ANDROID_APP_SIGNING_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          chmod 600 "$keystore"
          [[ -s "$keystore" ]] || { echo "Decoded keystore is empty" >&2; exit 1; }

          {
            echo "LAYMUX_ANDROID_VERSION_NAME=$version"
            echo "LAYMUX_ANDROID_VERSION_CODE=$version_code"
            echo "LAYMUX_ANDROID_APP_SIGNING_STORE_FILE=$keystore"
            echo "LAYMUX_ANDROID_APP_SIGNING_STORE_PASSWORD=$ANDROID_APP_SIGNING_KEYSTORE_PASSWORD"
            echo "LAYMUX_ANDROID_APP_SIGNING_KEY_ALIAS=$ANDROID_APP_SIGNING_KEY_ALIAS"
            echo "LAYMUX_ANDROID_APP_SIGNING_KEY_PASSWORD=$ANDROID_APP_SIGNING_KEY_PASSWORD"
            echo "LAYMUX_CLOUD_BASE_URL=https://app.laymux.com"
            echo "LAYMUX_GOOGLE_WEB_CLIENT_ID=$ANDROID_GOOGLE_WEB_CLIENT_ID"
          } >>"$GITHUB_ENV"

      - name: Test and build signed Android APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and stage Android APK
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$apk" ]] || { echo "Signed release APK was not produced" >&2; exit 1; }

          verify_output="$($build_tools/apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output"
          actual_fingerprint="$({ printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1; } | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$ANDROID_APP_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$actual_fingerprint" && "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo "Android signer certificate fingerprint mismatch" >&2
            exit 1
          }

          output_dir="$RUNNER_TEMP/laymux-android-release"
          output_apk="$output_dir/Laymux-Android-${LAYMUX_ANDROID_VERSION_NAME}.apk"
          mkdir -p "$output_dir"
          cp "$apk" "$output_apk"
          (cd "$output_dir" && sha256sum "$(basename "$output_apk")" >"$(basename "$output_apk").sha256")
          echo "ANDROID_RELEASE_APK=$output_apk" >>"$GITHUB_ENV"
          echo "ANDROID_RELEASE_CHECKSUM=$output_apk.sha256" >>"$GITHUB_ENV"

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$ANDROID_RELEASE_APK" "$ANDROID_RELEASE_CHECKSUM" --clobber

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "${LAYMUX_ANDROID_APP_SIGNING_STORE_FILE:-$RUNNER_TEMP/laymux-android-app-signing.jks}"

  channel_bootstrap:
    # The channel branch must already hold a valid manifest for both channels
    # *before* anything is published (ADR-0189). A channel-aware build that goes
    # latest first would send every upgraded install to a 404 for as long as the
    # downstream job took — or forever, if it failed.
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-channels
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Seed the channel branch if it is missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release-channels
        run: |
          set -euo pipefail

          stable_present="$(gh api "repos/$GITHUB_REPOSITORY/contents/desktop-stable.json?ref=$BRANCH" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$stable_present" ]]; then
            echo "channel branch already seeded"
            exit 0
          fi

          # Seed from the release that is currently latest: that is what the
          # stable channel means right now, and it keeps beta valid too.
          seed_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          [[ -n "$seed_tag" && "$seed_tag" != "null" ]] || {
            echo "No stable release to seed the channel branch from" >&2
            exit 1
          }

          channels="$RUNNER_TEMP/channels"
          mkdir -p "$channels"
          gh api "repos/$GITHUB_REPOSITORY/contents/desktop-beta.json?ref=$BRANCH" \
            --jq '.content' 2>/dev/null | base64 -d >"$channels/desktop-beta.json" || rm -f "$channels/desktop-beta.json"

          seed_manifest="$RUNNER_TEMP/seed-latest.json"
          gh release download "$seed_tag" --pattern latest.json --output "$seed_manifest" --clobber
          node scripts/release/channel-manifest.mjs \
            --tag "$seed_tag" --prerelease false --seed-stable true \
            --manifest "$seed_manifest" --channel-dir "$channels" \
            --owner "${GITHUB_REPOSITORY%%/*}" --repo "${GITHUB_REPOSITORY##*/}"

          "$GITHUB_WORKSPACE/scripts/release/publish-channel-commit.sh" \
            "$channels" "$BRANCH" "seed channel manifests from $seed_tag"

  publish:
    # Both channels gate on every required job. A beta that ships the desktop
    # ahead of its APK strands phones on a compat version bump (ADR-0189).
    needs: [prepare, build, android, channel_bootstrap]
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=false -f make_latest=true
          fi

  channels:
    # The channel manifest, not GitHub's `latest` pointer, is what the app reads
    # (ADR-0189). Runs only after the release is fully published so a channel can
    # never point at a draft or an incomplete artifact set.
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-channels
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}


      - name: Update channel manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          BRANCH: release-channels
        run: |
          set -euo pipefail

          channels="$RUNNER_TEMP/channels"
          mkdir -p "$channels"

          # Read the branch through the API rather than cloning: the channel
          # branch holds only these two files, and a clone would put the source
          # tree and a credential into the deployment working copy. The branch is
          # guaranteed to exist by the bootstrap job that gates publish.
          for file in desktop-stable.json desktop-beta.json; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$BRANCH" \
              --jq '.content' 2>/dev/null | base64 -d >"$channels/$file" || rm -f "$channels/$file"
          done

          manifest="$RUNNER_TEMP/latest.json"
          gh release download "$RELEASE_TAG" --pattern latest.json --output "$manifest" --clobber

          # Validation, the forward-only invariants and the write plan live in the
          # script so they are unit tested rather than discovered in a release.
          written="$(node "$GITHUB_WORKSPACE/scripts/release/channel-manifest.mjs" \
            --tag "$RELEASE_TAG" \
            --prerelease "$PRERELEASE" \
            --manifest "$manifest" \
            --channel-dir "$channels" \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo "${GITHUB_REPOSITORY##*/}")"
          printf 'channel files to publish:\n%s\n' "${written:-<none>}"

          "$GITHUB_WORKSPACE/scripts/release/publish-channel-commit.sh" \
            "$channels" "$BRANCH" "release: $RELEASE_TAG channel manifests"
