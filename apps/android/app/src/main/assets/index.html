<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Laymux</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="connection-stage">
      <section class="dashboard-scene" aria-hidden="true">
        <header class="scene-topbar">
          <div class="scene-brand">
            <img src="logo.svg" width="30" height="30" alt="" />
            <strong>Laymux</strong>
          </div>
          <span class="scene-avatar"></span>
        </header>

        <div class="scene-content">
          <div class="scene-heading">
            <span>내 PC</span>
            <h1>어디에서 작업할까요?</h1>
          </div>
          <div class="scene-device selected">
            <span class="scene-device-icon">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <rect x="3" y="4" width="18" height="13" />
                <path d="M8 21h8M12 17v4" />
              </svg>
            </span>
            <span class="scene-device-copy">
              <strong id="sceneDeviceName">선택한 PC</strong>
              <small>Laymux Desktop</small>
            </span>
            <span class="scene-online">온라인</span>
          </div>
          <div class="scene-device muted">
            <span class="scene-device-icon"></span>
            <span class="scene-device-copy">
              <strong></strong>
              <small></small>
            </span>
          </div>
        </div>
      </section>

      <button
        id="dismissLayer"
        class="dismiss-layer"
        type="button"
        aria-label="PC 목록으로 돌아가기"
      ></button>

      <section
        id="connectionSheet"
        class="connection-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="stateTitle"
        aria-describedby="stateDescription"
        aria-live="polite"
      >
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="connection-context">
          <span class="context-icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect x="3" y="4" width="18" height="13" />
              <path d="M8 21h8M12 17v4" />
            </svg>
          </span>
          <span>선택한 PC에 연결</span>
        </div>

        <div class="status-heading">
          <div id="stateBadge" class="badge">확인 중</div>
          <div class="status-copy">
            <h2 id="stateTitle">연결 상태를 확인하고 있습니다</h2>
            <p id="stateDescription">이 화면에서 안전한 연결을 준비합니다.</p>
          </div>
        </div>

        <p id="errorMessage" class="error" hidden></p>
        <p id="noticeMessage" class="notice" hidden></p>

        <section id="remoteSection" class="remote" hidden>
          <div class="remote-heading">
            <div>
              <div id="remoteBadge" class="badge secure">E2E 잠김</div>
              <h3 id="remoteTitle">암호화 원격 연결</h3>
            </div>
            <button id="disconnectButton" class="compact" type="button" hidden>
              연결 해제
            </button>
          </div>
          <p id="remoteDescription">
            생체 인증 후 세션을 엽니다. 15분 동안 사용하지 않으면 잠깁니다.
          </p>
          <button id="connectButton" class="primary" type="button">
            보안 세션 열기
          </button>
        </section>

        <div class="primary-actions">
          <button id="scanButton" class="primary" type="button">
            QR로 페어링
          </button>
          <button id="cloudButton" class="secondary" type="button">취소</button>
        </div>

        <details class="connection-settings">
          <summary>
            <span>연결 설정</span>
            <span id="pairingCount" class="count">0</span>
          </summary>
          <div class="settings-content">
            <section class="pairing-manager" aria-labelledby="pairingListTitle">
              <h3 id="pairingListTitle">저장된 PC</h3>
              <p id="pairingListEmpty" class="hint">
                저장된 페어링이 없습니다.
              </p>
              <div id="pairingList" class="pairing-list"></div>
            </section>
            <section class="protection" aria-labelledby="protectionTitle">
              <label class="protection-row" for="biometricToggle">
                <span>
                  <strong id="protectionTitle">생체 인증으로 키 보호</strong>
                  <small>키를 저장하거나 사용할 때마다 인증합니다.</small>
                </span>
                <input
                  id="biometricToggle"
                  type="checkbox"
                  role="switch"
                  checked
                />
              </label>
              <p id="biometricHint" class="hint"></p>
            </section>
          </div>
        </details>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
