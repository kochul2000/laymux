<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Laymux</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header" aria-labelledby="title">
        <img
          class="app-logo"
          src="logo.svg"
          width="52"
          height="52"
          alt=""
          aria-hidden="true"
        />
        <div class="brand-copy">
          <div class="eyebrow">Laymux Android</div>
          <h1 id="title">안전한 원격 연결</h1>
          <p>내 PC와 종단 암호화로 연결합니다.</p>
        </div>
      </header>

      <section class="card connection-card" aria-live="polite">
        <div class="status-heading">
          <div id="stateBadge" class="badge">확인 중</div>
          <div class="status-copy">
            <h2 id="stateTitle">페어링 상태를 확인하고 있습니다</h2>
            <p id="stateDescription">
              이 페어링 화면과 키 처리는 앱에 포함된 네이티브 경계에서
              실행됩니다.
            </p>
          </div>
        </div>

        <section
          class="pairing-manager panel-section"
          aria-labelledby="pairingListTitle"
        >
          <div class="pairing-manager-heading">
            <h3 id="pairingListTitle">저장된 PC</h3>
            <span id="pairingCount" class="count">0</span>
          </div>
          <p id="pairingListEmpty" class="hint">저장된 페어링이 없습니다.</p>
          <div id="pairingList" class="pairing-list"></div>
        </section>
        <section
          class="protection panel-section"
          aria-labelledby="protectionTitle"
        >
          <label class="protection-row" for="biometricToggle">
            <span>
              <strong id="protectionTitle">생체 인증으로 키 보호</strong>
              <small>키를 저장하거나 사용할 때마다 인증합니다.</small>
            </span>
            <input id="biometricToggle" type="checkbox" role="switch" checked />
          </label>
          <p id="biometricHint" class="hint"></p>
        </section>
        <p id="errorMessage" class="error" hidden></p>
        <p id="noticeMessage" class="notice" hidden></p>
        <div class="primary-actions">
          <button id="scanButton" class="primary" type="button">
            QR로 페어링
          </button>
          <button id="cloudButton" class="secondary" type="button">
            내 PC 목록으로
          </button>
        </div>
      </section>

      <section id="remoteSection" class="card remote" hidden>
        <div class="remote-heading">
          <div>
            <div id="remoteBadge" class="badge secure">E2E 잠김</div>
            <h2 id="remoteTitle">암호화 터미널</h2>
          </div>
          <button id="disconnectButton" class="compact" type="button" hidden>
            연결 해제
          </button>
        </div>
        <p id="remoteDescription">
          생체 인증 후 세션을 엽니다. 사용 중에는 유지되고 15분 비활성 시
          잠깁니다.
        </p>
        <button id="connectButton" class="primary" type="button">
          보안 세션 열기
        </button>
      </section>

      <aside class="security-note" aria-label="보안 안내">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <rect x="5" y="10" width="14" height="10" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <p>
          키는 Android Keystore에 보관됩니다. Relay는 암호화된 터미널 내용과
          제어 정보를 읽을 수 없습니다.
        </p>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
