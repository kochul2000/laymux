<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Laymux Remote</title>
    <!-- Installing the client to the home screen is what drops the address bar
         and gives the terminal that strip of height back (ADR-0091).
         `use-credentials`: a manifest fetch omits cookies by default, and this
         route is gated like the rest of `/remote/*`, so the default would 401. -->
    <link rel="manifest" href="/remote/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Matches --bg-base, so the installed window's status bar and the launch
         splash are the same colour as the page. -->
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS/iPadOS also supports the manifest, but apple-touch-icon takes
         precedence over manifest icons and the apple-* metadata keeps the
         legacy installation path compatible. Status bar style stays `default`:
         `black-translucent` would let the terminal's first row run underneath
         the clock. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Laymux" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/remote/pwa/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" href="/remote/pwa/icon-192.png" />
    <link rel="stylesheet" href="{{ASSET:xterm.css}}" />
    <link rel="stylesheet" href="{{ASSET:remote-app.css}}" />
  </head>
  <body>
    <div class="app">
      <header>
        <button id="navToggle" class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navigationPanel">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <button id="copyPaneId" class="copy-pane-button" type="button" hidden aria-label="Copy pane identifier" title="Copy pane identifier (lx:pane:...)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke-linecap="round"/></svg>
        </button>
        <div id="status" class="status">Enter the remote token, then connect.</div>
        <button id="spatialExclusion" class="spatial-exclusion-button" type="button" hidden aria-label="Exclude this pane from pane navigation" aria-pressed="false" title="Exclude this pane from pane navigation">
          <svg data-icon="circle-minus" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
        </button>
        <button id="inputModeToggle" class="input-mode-toggle" type="button" aria-pressed="false" aria-label="Switch to Composer input" title="Switch to Composer input">
          <span id="inputModeIcon" class="input-mode-icon" aria-hidden="true"></span>
        </button>
        <button id="desktopModeHeader" class="desktop-mode-button" type="button" hidden>PC</button>
      </header>
      <!-- Mirrors the widgets the desktop is drawing (ADR-0124). Placement,
           options and every value are owned there; this row only draws. -->
      <!-- Not a live region: the row rewrites itself every poll, and announcing
           an unchanged usage bar every few seconds is noise, not information. -->
      <div id="widgetStrip" class="widget-strip" role="group" aria-label="Status widgets" hidden>
        <div class="widget-strip-track">
          <div id="widgetStripLeft" class="widget-strip-side"></div>
          <div id="widgetStripRight" class="widget-strip-side"></div>
        </div>
      </div>
      <main>
        <div class="remote-body">
          <button id="navScrim" class="nav-scrim" type="button" aria-label="Close navigation" hidden></button>
          <aside id="navigationPanel" class="navigation-panel" aria-label="Remote navigation">
            <div class="drawer-header">
              <div class="drawer-heading">
                <div id="drawerTitle" class="drawer-title">Remote</div>
              </div>
              <div class="drawer-header-actions">
                <button id="desktopModeDrawer" class="desktop-mode-button" type="button" hidden>PC</button>
                <button id="newWorkspace" class="drawer-header-button" type="button" aria-label="New workspace" title="New workspace" disabled>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button id="drawerNotificationsButton" class="drawer-header-button drawer-notification-button" type="button" aria-label="Open notifications" title="Notifications" disabled>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
                  <span id="notificationBadge" class="workspace-count-badge drawer-notification-badge" hidden>0</span>
                </button>
                <button id="drawerConnectionButton" class="drawer-header-button" type="button" aria-label="Open connection" title="Connection">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5M16 3v5M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v4"/></svg>
                </button>
                <button id="drawerSettingsButton" class="drawer-header-button" type="button" aria-label="Open settings" title="Settings">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.37.32.7.6 1 .3.26.68.4 1.1.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
                </button>
                <button id="drawerBack" class="drawer-header-button" type="button" aria-label="Close and return to workspace navigation" title="Close" hidden>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
            </div>
            <div id="drawerWorkspaceView" class="drawer-view">
              <section id="fileViewerSection" class="nav-section locked" aria-label="File viewer">
              <h2 class="nav-section-title">File viewer</h2>
              <div class="file-viewer-panel">
                <div class="file-viewer-path-row">
                  <input id="fileViewerPath" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Host file path" placeholder="Host file path" disabled />
                </div>
                <div class="file-viewer-actions">
                  <button id="pullHostFileViewerPath" type="button" aria-label="Use current host viewer path" disabled>From host</button>
                  <button id="openFileViewer" type="button" disabled>Open viewer</button>
                </div>
                <div id="fileViewerStatus" class="file-viewer-status">Connect to open a host file.</div>
              </div>
              </section>
              <section id="workspaceSection" class="nav-section locked">
              <div class="workspace-section-heading">
                <button
                  id="hiddenWorkspaceToggle"
                  class="hidden-workspace-toggle"
                  type="button"
                  aria-expanded="false"
                  aria-controls="hiddenWorkspaceShelf"
                  hidden
                >
                  Hidden 0
                </button>
              </div>
              <div
                id="hiddenWorkspaceShelf"
                class="hidden-workspace-shelf"
                aria-label="Hidden workspaces"
                hidden
              ></div>
              <div id="workspaceList" class="nav-list"></div>
              </section>
              <section id="dockSection" class="nav-section locked">
              <button id="dockToggle" class="dock-tab" type="button" aria-expanded="false" aria-controls="dockPanel" disabled>
                <span class="dock-tab-label">Dock terminals</span>
                <span id="dockBadge" class="workspace-terminal-count" hidden>0</span>
              </button>
              <div id="dockPanel" class="dock-panel" hidden>
                <div id="dockList" class="nav-list"></div>
              </div>
              </section>
            </div><!-- /drawerWorkspaceView -->
            <div id="drawerNotificationsView" class="drawer-view drawer-notifications-view" hidden>
              <section id="notificationSection" class="nav-section locked" aria-label="Notifications">
                <div id="notificationPanel" class="notification-panel">
                  <div class="notification-actions">
                    <button id="markAllNotificationsRead" type="button" disabled>Mark read</button>
                    <button id="clearNotifications" class="danger" type="button" disabled>Clear</button>
                  </div>
                  <div id="notificationList" class="notification-list"></div>
                </div>
              </section>
            </div><!-- /drawerNotificationsView -->
            <div id="drawerCreateView" class="drawer-view" hidden>
              <section class="nav-section" aria-label="New workspace">
                <div id="newWorkspacePanel" class="new-workspace-panel" aria-label="Choose workspace layout"></div>
              </section>
            </div><!-- /drawerCreateView -->
            <div id="drawerConnectionView" class="drawer-view" hidden>
              <section class="connection-panel" aria-label="Remote connection">
                <div class="connection-title">Connection</div>
                <div class="connection-hint">Connect first to load workspaces and control the active terminal.</div>
                <label>Token <input id="token" type="password" autocomplete="current-password" /></label>
                <label>Name <input id="clientName" autocomplete="nickname" value="browser" /></label>
                <div class="connection-actions">
                  <button id="connect" class="primary">Connect</button>
                  <button id="exit" class="danger">Exit</button>
                  <button id="refresh" disabled>Refresh</button>
                </div>
              </section>
            </div><!-- /drawerConnectionView -->
            <div id="drawerSettingsView" class="drawer-view" hidden>
              <!-- Device-local display choices (ADR-0132). Not `locked`: what
                   this browser spends its chrome rows on is nobody's lease. -->
              <section id="displaySection" class="nav-section" aria-label="Display">
              <h2 class="nav-section-title">Display</h2>
              <label class="nav-toggle-row" for="widgetStripToggle">
                <input id="widgetStripToggle" type="checkbox" checked />
                <span class="nav-toggle-name">Widget bar</span>
                <span class="nav-toggle-desc">Row under the header</span>
              </label>
              </section>
              <!-- Installing drops the address bar (ADR-0091), but every browser
                   buries that path in its own menu. The offer lives here, not over
                   the terminal, and only appears while it can be acted on
                   (ADR-0099). -->
              <section id="installSection" class="nav-section" aria-label="Install this app" hidden>
              <h2 class="nav-section-title">Install</h2>
              <div class="install-panel">
                <button id="installApp" class="install-button" type="button">Install PWA</button>
                <div id="installHint" class="install-hint" hidden>iOS installs from the share sheet: Share → “Add to Home Screen”.</div>
              </div>
              </section>
            </div><!-- /drawerSettingsView -->
          </aside>
          <div class="terminal-shell">
            <div id="terminal" aria-label="Terminal output">
              <div id="terminalViewport"><div id="terminalSizer"></div></div>
              <button id="scrollToBottom" class="terminal-scroll-to-bottom" type="button" hidden aria-label="Scroll to bottom" title="Scroll to bottom">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 8.5 7 7 7-7" />
                </svg>
              </button>
            </div>
            <section id="terminalComposer" class="terminal-composer" aria-label="Terminal input composer" hidden>
              <ul id="composerHistoryList" class="composer-suggest-list" role="listbox" aria-label="Recent terminal input" hidden></ul>
              <ul id="composerAutocompleteList" class="composer-suggest-list" role="listbox" aria-label="Terminal input suggestions" hidden></ul>
              <textarea
                id="composerInput"
                class="composer-input"
                aria-label="Compose terminal input"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Enter to send · Shift+Enter for a newline"
              ></textarea>
            </section>
          </div>
        </div>
      </main>
      <nav id="keyBar" class="key-bar" aria-label="Special keys" hidden>
        <div id="keyRow" class="key-row" role="group" aria-label="Special key buttons">
          <button id="keyBarSettings" class="key-bar-settings" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="keyPopover" title="Choose key sets">⚙</button>
        </div>
        <div id="keyFlickHint" class="key-flick-hint" data-direction="" aria-hidden="true" hidden>
          <span class="key-flick-arrow" data-flick-direction="up">↑</span>
          <span class="key-flick-arrow" data-flick-direction="right">→</span>
          <span class="key-flick-arrow" data-flick-direction="down">↓</span>
          <span class="key-flick-arrow" data-flick-direction="left">←</span>
          <span class="key-flick-center"></span>
        </div>
        <div id="keyPopover" class="key-popover" hidden>
          <div id="keyPopoverBody" class="key-popover-scroll"></div>
        </div>
      </nav>
      <footer>
        <button id="ctrlC" disabled>Ctrl+C</button>
        <button id="focusTerminal" disabled>Keyboard</button>
        <button id="keyBarToggle" class="key-toggle" type="button" aria-pressed="false" aria-controls="keyBar" title="Toggle special-key toolbar">Keys</button>
        <div id="terminalMeta" class="status-hint grow">No terminal selected.</div>
        <button id="composerSend" class="composer-send" type="button" hidden aria-label="Send input" title="Send">
          <svg data-icon="paper-plane" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.47 20.21 19.91 4.09 3.8 10.53l3.75 3.77 9.14-6.99-6.99 9.14 3.77 3.76Z"/></svg>
        </button>
      </footer>
    </div>
    <script src="{{ASSET:xterm.js}}"></script>
    <!-- Shared cell-width provider (issue #538). Generated from
         ui/src/lib/terminal-unicode-width.ts so the remote client wraps at the
         same columns as the desktop instead of xterm default Unicode 6 widths. -->
    <script src="{{ASSET:unicode-provider.js}}"></script>
    <script src="{{ASSET:addon-fit.js}}"></script>
    <script src="{{ASSET:addon-web-links.js}}"></script>
    <script src="{{ASSET:remote-app.js}}"></script>
  </body>
</html>
