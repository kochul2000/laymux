[package]
name = "laymux-agent-hook"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
base64 = "0.22"
toml = "0.9"
toml_edit = "0.25.5"
